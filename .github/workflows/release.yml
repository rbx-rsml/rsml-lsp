name: Release LSP

on:
  push:
    tags: ["lsp-v*"]

concurrency:
  group: release-lsp-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.derive.outputs.semver }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive Version
        id: derive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          SEMVER="${TAG_NAME#lsp-v}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG_NAME → semver: $SEMVER"

      - name: Check Cargo.toml Version Matches Tag
        run: |
          SEMVER="${{ steps.derive.outputs.semver }}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$CARGO_VERSION" != "$SEMVER" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag (lsp-v$SEMVER). Update Cargo.toml before releasing."
            exit 1
          fi

      - name: Check CHANGELOG.md Has Entry
        run: |
          SEMVER="${{ steps.derive.outputs.semver }}"
          if ! grep -q "^# v$SEMVER\$" CHANGELOG.md; then
            echo "::error::No changelog entry found for v$SEMVER in CHANGELOG.md. Add a '# v$SEMVER' section before releasing."
            exit 1
          fi

  create-release:
    name: Create Release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Release Body
        env:
          SEMVER: ${{ needs.preflight.outputs.semver }}
        run: |
          CHANGELOG=$(awk -v tag="v$SEMVER" '
            BEGIN { found=0 }
            /^# / {
              if (found) exit
              if ($0 == "# " tag) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')

          if [ -z "$CHANGELOG" ]; then
            echo "::error::No changelog entry found for v$SEMVER in CHANGELOG.md"
            exit 1
          fi

          CHANGELOG=$(printf '%s' "$CHANGELOG" | sed 's/^#/##/')

          cat > /tmp/release_body.md << EOF
          # Changelog
          ${CHANGELOG}
          EOF

      - name: Create or Update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SEMVER: ${{ needs.preflight.outputs.semver }}
        run: |
          TITLE="LSP - v$SEMVER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Updating."
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file /tmp/release_body.md
          else
            gh release create "$TAG" --draft --verify-tag --title "$TITLE" --notes-file /tmp/release_body.md
          fi

  build:
    needs: ["create-release"]
    strategy:
      fail-fast: false
      matrix:
        # https://doc.rust-lang.org/rustc/platform-support.html
        include:
          - host: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64

          - host: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

          - host: macos
            os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64

          - host: macos
            os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64

    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      BIN: rsml-lsp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Rust
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-04-15
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --locked --verbose --target ${{ matrix.target }}

      - name: Save Rust Cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate File Stem
        shell: bash
        run: |
          echo "FILE_STEM=$BIN-${{ matrix.label }}" >> "$GITHUB_ENV"

      - name: Generate Artifact Name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=$BIN-server-${{ matrix.label }}.tar.gz" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir staging

          if [ "${{ matrix.host }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/$BIN.exe" "staging/$FILE_STEM.exe"
          else
            cp "target/${{ matrix.target }}/release/$BIN" "staging/$FILE_STEM"
          fi

          tar -czf "$ARTIFACT_NAME" -C staging .

      - name: Upload Archive to Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ env.ARTIFACT_NAME }}

  upload-to-release:
    name: Upload to Release
    needs: ["build"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Upload Archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in ./artifacts/**/*.tar.gz; do
            gh release upload ${{ github.ref_name }} "$archive" --clobber
          done

  publish-release:
    name: Publish Release
    needs: upload-to-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}
