name: "Release Extension (VS Code)"

on:
  push:
    tags: ["vscode-v*"]

jobs:
  preflight:
    name: Verify LSP Release
    runs-on: ubuntu-latest
    outputs:
      lsp-tag: ${{ steps.read-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read LSP Version
        id: read-version
        run: |
          VERSION=$(tr -d '\n\r' < extensions/vscode/lsp-version.txt)
          TAG="lsp-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "LSP version: $VERSION (tag: $TAG)"

      - name: Verify LSP Release Exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.read-version.outputs.tag }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::LSP release '$TAG' does not exist. Create an LSP release first by pushing a matching lsp-v* tag."
            exit 1
          fi
          echo "LSP release '$TAG' found."

  build-vscode:
    name: Build VS Code
    needs: preflight
    runs-on: ubuntu-latest
    env:
      BIN: rsml-lsp-vscode
      LSP_TAG: ${{ needs.preflight.outputs.lsp-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore Bun Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.19

      - name: Install Dependencies
        run: cd extensions/vscode && bun install

      - name: Get Semantic Version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "SEMVER=${TAG_NAME#vscode-v}" >> "$GITHUB_ENV"

      - name: Update Version In package.json
        run: |
          cd extensions/vscode
          if ! bun pm version ${{ env.SEMVER }}; then
            echo "Version not changed"
          fi

      - name: Transpile TS to JS
        run: cd extensions/vscode && bun run build --release

      - name: Cache Bun
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Remove Redundant Files and Dirs
        run: |
          cd extensions/vscode
          [ -d node_modules ] && rm -r node_modules
          [ -d src ] && rm -r src
          [ -f tsconfig.json ] && rm -r tsconfig.json
          [ -f build.mjs ] && rm -r build.mjs
          [ -f bun.lock ] && rm -r bun.lock

      - name: Generate Artifact Name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=$BIN.zip" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          cd extensions/vscode
          zip -r ../../${{ env.ARTIFACT_NAME }} . -x ".git/*"

      - name: Upload VSCode LSP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ env.ARTIFACT_NAME }}

      - name: Add Artifact To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} $ARTIFACT_NAME

      - name: Install vsce
        run: bun install -g vsce

      - name: Publish extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: cd extensions/vscode && vsce publish --pat $VSCE_TOKEN
