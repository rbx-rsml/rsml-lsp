name: "Build Extension (VS Code)"

on:
  push:
    tags: ["vscode-v*"]

jobs:
  build: 
    uses: ./.github/workflows/release.yml

  build-vscode:
    name: Build VS Code
    needs: build
    runs-on: ubuntu-latest
    env:
      BIN: rsml-lsp-vscode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
        
      - name: Restore Bun Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.19

      - name: Install Dependencies
        run: cd extensions/vscode && bun install

      - name: Get Semantic Version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "SEMVER=${TAG_NAME#vscode-v}" >> "$GITHUB_ENV"

      - name: Update Version In package.json
        run: |
          cd extensions/vscode
          if ! bun pm version ${{ env.SEMVER }}; then
            echo "Version not changed"
          fi

      - name: Transpile TS to JS
        run: cd extensions/vscode && bun run build --release

      - name: Cache Bun
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Remove Redundant Files and Dirs
        run: |
          cd extensions/vscode
          [ -d src ] && rm -r src
          [ -f tsconfig.json ] && rm -r tsconfig.json

      - name: Download LSP Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Create Server Artifacts Destination
        run: mkdir -p extensions/vscode/server

      - name: Extract Server Artifacts To Destination
        run: |
          for archive in ./downloaded-artifacts/**/*.zip; do
            unzip -o "$archive" -d extensions/vscode/server
          done

      - name: Install vsce
        run: bun install -g vsce

      - name: Publish extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: cd extensions/vscode && vsce publish --pat $VSCE_TOKEN

      - name: Remove Redundant Files and Dirs
        run: |
          cd extensions/vscode
          [ -d node_modules ] && rm -r node_modules

      - name: Generate Artifact Name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=$BIN.zip" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          cd extensions/vscode
          zip -r ../../${{ env.ARTIFACT_NAME }} . -x ".git/*"
      
      - name: Upload VSCode LSP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ env.ARTIFACT_NAME }}

      - name: Add Artifact To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} $ARTIFACT_NAME
