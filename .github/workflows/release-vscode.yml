name: "Release Extension (VS Code)"

on:
  push:
    tags: ["vscode-v*"]

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.derive.outputs.semver }}
      lsp-tag: ${{ steps.derive.outputs.lsp-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive Versions
        id: derive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          SEMVER="${TAG_NAME#vscode-v}"
          LSP_VERSION=$(tr -d '\n\r' < extensions/vscode/lsp-version.txt)
          LSP_TAG="lsp-v${LSP_VERSION}"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "lsp-tag=$LSP_TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG_NAME → semver: $SEMVER, LSP tag: $LSP_TAG"

      - name: Check package.json Version Matches Tag
        run: |
          SEMVER="${{ steps.derive.outputs.semver }}"
          PKG_VERSION=$(node -p "require('./extensions/vscode/package.json').version")
          if [ "$PKG_VERSION" != "$SEMVER" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag (vscode-v$SEMVER). Update extensions/vscode/package.json before releasing."
            exit 1
          fi

      - name: Check CHANGELOG.md Has Entry
        run: |
          SEMVER="${{ steps.derive.outputs.semver }}"
          if ! grep -q "^# v$SEMVER\$" extensions/vscode/CHANGELOG.md; then
            echo "::error::No changelog entry found for v$SEMVER in extensions/vscode/CHANGELOG.md. Add a '# v$SEMVER' section before releasing."
            exit 1
          fi

      - name: Verify LSP Release Exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LSP_TAG="${{ steps.derive.outputs.lsp-tag }}"
          if ! gh release view "$LSP_TAG" > /dev/null 2>&1; then
            echo "::error::LSP release '$LSP_TAG' does not exist. Create an LSP release first by pushing a matching lsp-v* tag."
            exit 1
          fi
          echo "LSP release '$LSP_TAG' found."

  create-release:
    name: Create Release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Release Body
        env:
          TAG: ${{ github.ref_name }}
          SEMVER: ${{ needs.preflight.outputs.semver }}
        run: |
          CHANGELOG=$(awk -v tag="v$SEMVER" '
            BEGIN { found=0 }
            /^# / {
              if (found) exit
              if ($0 == "# " tag) { found=1; next }
            }
            found { print }
          ' extensions/vscode/CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')

          if [ -z "$CHANGELOG" ]; then
            echo "::error::No changelog entry found for v$SEMVER in extensions/vscode/CHANGELOG.md"
            exit 1
          fi

          CHANGELOG=$(printf '%s' "$CHANGELOG" | sed 's/^#/##/')

          MARKETPLACE_URL="https://marketplace.visualstudio.com/items?itemName=rbx-rsml.roblox-style-management-language"

          cat > /tmp/release_body.md << EOF
          # Changelog
          ${CHANGELOG}

          ---

          # Marketplace
          Install via the [VS Code Marketplace](${MARKETPLACE_URL}).
          EOF

      - name: Create or Update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Updating."
            gh release edit "$TAG" --draft --title "RSML LSP $TAG" --notes-file /tmp/release_body.md
          else
            gh release create "$TAG" --draft --verify-tag --title "RSML LSP $TAG" --notes-file /tmp/release_body.md
          fi

  build-vscode:
    name: Build VS Code
    needs: create-release
    runs-on: ubuntu-latest
    env:
      BIN: rsml-lsp-vscode
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore Bun Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.19

      - name: Install Dependencies
        run: cd extensions/vscode && bun install

      - name: Transpile TS to JS
        run: cd extensions/vscode && bun run build --release

      - name: Cache Bun
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bun
            ~/bun.lock
            extensions/vscode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Remove Redundant Files and Dirs
        run: |
          cd extensions/vscode
          [ -d node_modules ] && rm -r node_modules
          [ -d src ] && rm -r src
          [ -f tsconfig.json ] && rm -r tsconfig.json
          [ -f build.mjs ] && rm -r build.mjs
          [ -f bun.lock ] && rm -r bun.lock

      - name: Generate Artifact Name
        shell: bash
        run: |
          echo "ARTIFACT_NAME=$BIN.zip" >> "$GITHUB_ENV"

      - name: Create Archive
        shell: bash
        run: |
          cd extensions/vscode
          zip -r ../../${{ env.ARTIFACT_NAME }} . -x ".git/*"

      - name: Upload VSCode LSP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.ARTIFACT_NAME }}
          name: ${{ env.ARTIFACT_NAME }}

      - name: Add Artifact To Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} $ARTIFACT_NAME --clobber

      - name: Install vsce
        run: bun install -g vsce

      - name: Publish extension
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: cd extensions/vscode && vsce publish --pat $VSCE_TOKEN

  publish-release:
    name: Publish Release
    needs: build-vscode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}
