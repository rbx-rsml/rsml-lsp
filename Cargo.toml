[package]
name = "rsml-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]

tower-lsp = "0.20.0"
tokio = { version = "1.46.1", features = ["full"] }
tree-sitter = "0.25.6"
tree-sitter-rsml = "0.1.13"
baz-tree-sitter-traversal = "0.1.3"
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }
ropey = "1.6.1"
logos = "0.15.0"
guarded = "0.0.2"
phf = "0.12.1"
phf_macros = "0.12.1"
once_cell = "1.21.3"
levenshtein = "1.0.5"
serde_json = "1.0.141"
enum-kinds = "0.5.1"
array-concat = "0.5.5"

[build-dependencies]
lalrpop = { version = "0.22.2", features = [ "unicode" ] } 
cc="*"